# Local dev/test compose file — builds Dockerfile.dev so PHP/Composer/Node
# commands can run against the bind-mounted source tree via:
#   docker compose exec app <command>
# The app itself is reachable at http://localhost:8000, and the Vite dev
# server (for `npm run dev`, see manual-testing doc) at http://localhost:5173.
# Not used in production (see docker-compose-prod.yml for that).
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      # node_modules gets its own volume rather than the host bind mount:
      # this container is Linux, the host may not be (native npm packages
      # like esbuild ship platform-specific binaries), so sharing one
      # node_modules between host and container breaks whichever one didn't
      # run the last `npm install`.
      - node_modules_data:/var/www/html/node_modules
    # Bound to loopback only — this is a dev/test container with fake auth
    # and no real credentials, but there's no reason to expose it to the
    # rest of the local network. Inside the container, artisan/vite still
    # bind to 0.0.0.0 (see below/manual-testing doc) since that's required
    # for Docker's own port forwarding to reach the process at all.
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:5173:5173"
    environment:
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
    # NOTE: this is a folded (>) scalar — it collapses to a single shell line,
    # so no `#` comments may be added inside the sh -c "..." string below.
    #
    # `--no-reload` on `artisan serve` is required: artisan serve's file-watcher
    # restart re-execs the server without this container's env overrides
    # (DB_CONNECTION/DB_DATABASE above), falling back to .env's mysql settings
    # and 500ing every request.
    command: >
      sh -c "
      composer install --no-interaction &&
      [ -f .env ] || cp .env.example .env &&
      grep -q '^APP_KEY=base64' .env || php artisan key:generate --ansi --force &&
      touch database/database.sqlite &&
      php artisan migrate --graceful --ansi --force &&
      php artisan serve --host=0.0.0.0 --port=8000 --no-reload
      "

volumes:
  node_modules_data:
